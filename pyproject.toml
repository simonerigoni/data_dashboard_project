[project]
name = "data-dashboard-project"
version = "0.1.0"
description = "Portfolio Exercise: Deploy a Data Dashboard"
readme = "README.md"
requires-python = ">=3.15"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.md"]
authors = [{ name = "Simone Rigoni" }]
dependencies = [
    "dotenv>=0.9.9",
    "dash>=3.3.0",
    "pandas>=2.3.3",
    "quandl>=3.7.0",
    "dash-bootstrap-components>=2.0.4",
    "colorlover>=0.3.0",
]


[project.urls]
Repository = "https://github.com/simonerigoni/data_dashboard_project"

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest-cov>=7.1.0",
    "ruff>=0.14.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# pycodestyle/pyflakes defaults plus import sorting (I), pyupgrade (UP), and flake8-bugbear (B)
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pyright]
exclude = [".venv"]
venvPath = "."
venv = ".venv"
